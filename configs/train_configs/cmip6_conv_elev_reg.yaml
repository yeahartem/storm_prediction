experiment_name: cmip6_reg_test_elev
project_name: Wind-speed-regression
target_type: wind_ms

data_dir: data/cmip6_world
path_to_prepared_target_data: data/cmip5_world3/target.parquet
path_to_prepared_stations: data/cmip5_world3/stations.parquet

model_name: WindNetElev41x41
use_elevation: true
normalize: false
precision: 16 #  16 32 "16-mixed" "bf16-mixed"
half_side_size: 41
time_window: 83  # odd only
time_agg_window: 28
time_freq: 28
target_threshold: 20
target_max: 68.94
target_min: 0.0

min_height: -10
max_height: 800
train_coords:
  lat_min: -88.0
  lat_max: 88.0
  lon_min: -179.0
  lon_max: 180.45

test_coords:
  lat_min: 43.62
  lat_max: 62.23
  lon_min: 36.68
  lon_max: 63.20

variables:
- sfcWindmax
- sfcWind
- pr
- psl
- tasmax
- tasmin

start_time: '1975-01-01'
end_time: '2020-12-12'
start_of_test: '2008-01-01'

batch_size: 120
learning_rate: 0.009
weight_decay: 0.0001
max_epoch: 3


optimizer_name: 'AdamW'
scheduler_name: 'LinearLR'
loss_name: 'MSELoss'
eval: false

num_workers: 6
gpu_num: 8
distributed: true
num_nodes: 1
strategy: 'ddp'

log_every_n_steps: 100 