experiment_name: cmip6_reg_test_elev
project_name: Wind-speed-regression
target_type: wind_ms

data_dir: ./data/cmip6_world
path_to_prepared_target_data: ./data/cmip6_world/target.parquet
path_to_prepared_stations: ./data/cmip6_world/stations.parquet

model_name: WindNetElev41x41
use_elevation: true
normalize: false
precision: 16 #  16 32 "16-mixed" "bf16-mixed"
half_side_size: 41
time_window: 41  # odd only
time_agg_window: 28
time_freq: 10
target_threshold: 20
target_max: 68.94
target_min: 0.0

min_height: -10
max_height: 800
train_coords:
  lat_min: -88.0
  lat_max: 88.0
  lon_min: -179.0
  lon_max: 180.45

test_coords:
  lat_min: 43.62
  lat_max: 62.23
  lon_min: 36.68
  lon_max: 63.20

variables:
- sfcWindmax
- sfcWind
- pr
- psl
- tasmax
- tasmin

start_time: '2000-01-01'
end_time: '2010-11-14'
start_of_test: '2008-01-01'

batch_size: 2
learning_rate: 0.008
weight_decay: 0.0001
max_epoch: 5


optimizer_name: 'SGD'
scheduler_name: 'OneCycleLR'
loss_name: 'MSELoss'
eval: false

num_workers: 4
gpu_num: 1
distributed: false
num_nodes: 1
strategy: 'ddp'

log_every_n_steps: 100 