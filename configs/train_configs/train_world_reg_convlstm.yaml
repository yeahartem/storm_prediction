---
experiment_name: "cmip5_reg_w_ConvLSTM"
project_name: "Wind-speed-regression"

data_dir: "./data_mounted/cmip5_world"
path_to_prepared_target_data: "./data_mounted/cmip5_world/target.parquet"
path_to_prepared_stations: "./data_mounted/cmip5_world/stations.parquet"
path_to_means: "./data_mounted/cmip5_world/normalization_values_mean.npy"
path_to_std: "./data_mounted/cmip5_world/normalization_values_std.npy"

half_side_size: 20
time_window: 6
time_freq: 4

min_height: -10
max_height: 800
train_coords:
  lat_min: -48.38
  lat_max: 80.52
  lon_min: -179.12
  lon_max: 180.45
test_coords:
  lat_min: 43.62
  lat_max: 62.23
  lon_min: 36.68
  lon_max: 63.20
variables:
- sfcWindmax
- sfcWind
- pr
- psl
- tasmax
- tasmin
time_limits:
- '2000-01-01'
- '2020-11-14'
start_of_test: '2008-01-01'

# stride: 1
hidden_dim: 100
kernel_size:  
- 5 
- 5
num_layers: 3
batch_first: True
bias: True
return_all_layers: False

batch_size: 80
learning_rate: 0.0004
weight_decay: 0.0001
max_epoch: 40

num_workers: 4
gpu_num: 3