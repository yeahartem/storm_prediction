---
experiment_name: cmip6_lrsch_reg_w_naivemode41x41_max
project_name: Wind-speed-regression
target_type: wind_ms

data_dir: ./data/cmip5_world3
path_to_prepared_target_data: ./data/cmip5_world3/target.parquet
path_to_prepared_stations: ./data/cmip5_world3/stations.parquet
flush_start: true
path_to_checkpoint: out/checkpoints/epoch=0-step=21023.ckpt

model_name: WindNet41x41
normalize: false
precision: 16 #  16 32
half_side_size: 41
time_window: 41  # odd only
time_agg_window: 28
time_freq: 1
target_threshold: 20
target_max: 68.94
target_min: 0.0

min_height: -10
max_height: 800
train_coords:
  lat_min: -88.0
  lat_max: 88.0
  lon_min: -179.0
  lon_max: 180.45

test_coords:
  lat_min: 43.62
  lat_max: 62.23
  lon_min: 36.68
  lon_max: 63.20
  
variables:
- sfcWindmax
- sfcWind
- pr
- psl
- tasmax
- tasmin

start_time: '2006-01-01'
end_time: '2023-11-14'
start_of_test: '2008-01-01' 


batch_size: 50
learning_rate: 0.008
weight_decay: 0.0001
max_epoch: 5


optimizer_name: 'SGD'
scheduler_name: 'OneCycleLR'
loss_name: 'MSELoss'
eval: false

num_workers: 0
gpu_num: 1
distributed: false
num_nodes: 1
strategy: 'ddp'

log_every_n_steps: 100