---
experiment_name: "cmip5_normtarget_reg_w_naivemode20x42_max"
project_name: "Wind-speed-regression"
target_type: "wind_ms"

data_dir: "./data_mounted/cmip5_world"
path_to_prepared_target_data: "./data_mounted/cmip5_world/target.parquet"
path_to_prepared_stations: "./data_mounted/cmip5_world/stations.parquet"
path_to_means: "./data_mounted/cmip5_world/normalization_values_mean.npy"
path_to_std: "./data_mounted/cmip5_world/normalization_values_std.npy"

half_side_size: 20
time_window: 42
time_freq: 7
target_threshold: 20
target_max: 68.94
target_min: 0.0

min_height: -10
max_height: 800
train_coords:
  lat_min: -48.38
  lat_max: 80.52
  lon_min: -179.12
  lon_max: 180.45

test_coords:
  lat_min: 43.62
  lat_max: 62.23
  lon_min: 36.68
  lon_max: 63.20
variables:
- sfcWindmax
- sfcWind
- pr
- psl
- tasmax
- tasmin
time_limits:
- '1950-01-01'
- '2020-11-14'
start_of_test: '2008-01-01'

batch_size: 180
learning_rate: 0.0004
weight_decay: 0.0001
max_epoch: 40
scheduler_steps: 200

num_workers: 8
gpu_num: 4
data_in_ram: true