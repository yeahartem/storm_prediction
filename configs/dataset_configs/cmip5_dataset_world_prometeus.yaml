---
experiment_name: cmip5world
make_climate_data: false
make_normalization: false
make_cleaned_weather_data: true
make_target: true
load_normalization: false

paths_to_climate_files_folders: 
- data_mounted/cmip5_world2

path_to_weather_stations: 'data_mounted/weatherstation_data/'
data_dir: data_mounted/cmip5_world3/ # the rest will be saved in this directory
prepared_target_data_name: target.parquet

saved_normalized: true #only save to float16 with saved_normalized=true 
precision: 16 # 32 
min_height: -10
max_height: 800
spatial_crop: False
train_coords:
  lat_min: -88.0
  lat_max: 88.0
  lon_min: -179.0
  lon_max: 180.45

variables:
- sfcWindmax
- sfcWind
- pr
- psl
- tasmax
- tasmin
time_limits:
- '1950-01-01'
- '2020-11-14'
start_of_test: '2008-01-01'

half_side_size: 20
pad_data: false
target_column: 
- max_speed