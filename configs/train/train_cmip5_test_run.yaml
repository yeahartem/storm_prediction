model_name: WindNet27x47
make_tmp_target_file: False

use_elevation: false
normalize: false      # precision 16 is already normalized
time_agg_window: 28   # range in days, used to calculate maximum for every day of target
time_freq: 14         # get sample from target every {time_freq} days
target_threshold: 20

data_dir: data/cmip5_world/      # directory to get climate files for training
target_data_file: target.parquet  # target data file in data_dir for training
       
start_time: '2006-02-02'
end_time: '2010-02-02'
start_of_test: '2008-03-03'

variables:                                      #CMIP variable names to use
- sfcWindmax
- tasmax
- tasmin
spatial_crop: true
lat_min: 30
lat_max: 50
lon_min: -30
lon_max: 40

batch_size: 15
learning_rate: 0.001
weight_decay: 0.0001
max_epoch: 1      # 2 !!!!!!!!!!!!!!!!

optimizer_name: 'AdamW'
scheduler_name: 'LinearLR'
loss_name: 'MSELoss'

num_workers: 0
gpu_num: 1
distributed: false
num_nodes: 1
strategy: 'ddp'

log_every_n_steps: 100 

cache:
  # Поставьте true, чтобы загружать данные из кэша, false - чтобы сгенерировать и сохранить их.
  use_cached_padding: false 
  
  # Путь для сохранения основного обработанного массива данных
  pad_crop_data_path: "data/cache/pad_crop_data.npy" # Используем формат NetCDF, идеальный для данных с координатами
  
  # Путь для сохранения данных о сдвиге
  shift_data_path: "data/cache/shift_data.pkl" # Используем pickle для простого объекта Python
