model_name: WindNetElev83x41 # have no effect
use_elevation: true
normalize: false      # precision 16 is already normalized
time_agg_window: 28   # range in days, used to calculate maximum for every day of target
time_freq: 28         # get sample from target every {time_freq} days
target_threshold: 20

data_dir: data/cmip6_world/       # directory to get climate files for training
target_data_file: target.parquet  # target data file in data_dir for training

start_time: '2007-01-01'
end_time: '2008-06-06'
start_of_test: '2008-01-01'

batch_size: 90
learning_rate: 0.009
weight_decay: 0.0001
max_epoch: 3


optimizer_name: 'AdamW'
scheduler_name: 'LinearLR'
loss_name: 'MSELoss'

num_workers: 6
gpu_num: 8
distributed: true
num_nodes: 1
strategy: 'ddp'

log_every_n_steps: 100 