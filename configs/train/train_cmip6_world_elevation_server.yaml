make_tmp_target_file: False

use_elevation: true
in_chans: 5               # 4 CMIP6 vars + 1 elevation channel
normalize: false          # precision 16 is already normalized

time_agg_window: 28
time_freq: 14
target_threshold: 15.0
abs_wind_threshold: 15.0

data_dir: data/cmip6_world/
target_data_file: target.parquet

start_time: '2000-01-01'
end_time: '2024-12-31'
start_of_val: '2021-01-01'   # train < this < val < start_of_test
start_of_test: '2023-01-01'

variables:
- sfcWindmax
- pr
- tasmax
- tasmin

spatial_crop: false
lat_min: 30
lat_max: 50
lon_min: -30
lon_max: 40

batch_size: 32            # 2x vs local (24GB VRAM x2)
learning_rate: 0.0001
weight_decay: 0.01
max_epoch: 100

optimizer_name: 'AdamW'
scheduler_name: 'WarmupCosineLR'
cosine_t_max: 20          # LR decays lr->lr/100 over 20 epochs; matches expected training length
loss_name: 'BCELoss'
label_smoothing: 0.05
neg_subsample_ratio: 1.0  # keep negatives:positives = 1:1
use_pos_weight: false      # disabled: undersampling already balances classes

num_workers: 8            # server has many CPU cores
gpu_num: 2
distributed: true
num_nodes: 1
strategy: 'ddp'

limit_train_batches: 5000
limit_val_batches: 1000

log_every_n_steps: 50

test_only: false
ckpt_path: null

cache:
  use_cached_padding: false
  pad_crop_data_path: "data/cache/cmip6_pad_crop_data.npy"
  shift_data_path: "data/cache/cmip6_shift_data.pkl"

# --- Improvements added 2026-05-01 ---
# Validation: deterministic 32K subset, no shuffle, twice per epoch.
val_subset_size: 32000
val_subset_seed: 42
val_samples_per_station: 6   # stratified val: K random samples per station (more reliable than uniform)
val_check_interval: 1.0           # one val per epoch — deterministic subset already gives clean signal
# LR schedule: 5% linear warmup + cosine decay over the entire run.
warmup_pct: 0.05
eta_min_factor: 0.01
# Stochastic depth in the backbone (light regularisation).
drop_path_rate: 0.1
# pos must NOT be concatenated with backbone features (climatology leakage).
use_pos_in_head: false
# Training stability + Stochastic Weight Averaging.
gradient_clip_val: 1.0
use_swa: true
swa_lrs: 0.00001
swa_epoch_start: 0.7
early_stopping_patience: 8
# --- end improvements ---
