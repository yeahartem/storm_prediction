wind_risk_threshold: 20
use_elevation: false

time_start: '2018-06-06'
time_end: '2018-12-12'

lat_min: 30
lat_max: 40
lon_min: 50
lon_max: 60 

interpolation_res: 0.2           #if None - does not apply interpolation

num_workers_eval: 16
batch_size_test: 60 
distributed_test: false
strategy: ddp
gpu_num: 1

save_kml: true                   #if false, saves to csv

data_dir: data/cmip5_world3/      # directory to get climate files for test and inference
target_data_file: target.parquet  # target data file in data_dir for training for test and inference

path_to_checkpoint: /app/wind/out/checkpoints/epoch=0-step=4825.ckpt
path_to_predictions: out/predictions/result_world_cmip5.csv
output_file: out/predictions/output_file_world_cmip5      #format is chosen from `save_kml` boolean attribute
cmip_type: CMIP5